name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Check Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Print versions
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Python: $(python3 --version)"

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gvp-guard:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/gvp-guard:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/gvp-guard:cache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying gvp-guard to staging environment"
          echo "Use: docker compose up -d"
